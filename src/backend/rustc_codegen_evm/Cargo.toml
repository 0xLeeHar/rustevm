[package]
name = "rustc_codegen_evm"
description = "A rustc codegen backend that emits EVM (Ethereum Virtual Machine) bytecode"
authors.workspace = true
version.workspace = true
edition.workspace = true

# Must be a dylib so rustc can dlopen it at compile time.
# The rustc internal src are linked into the compiler itself; they are NOT
# listed here as Cargo dependencies.  Instead they are accessed via
# `#![feature(rustc_private)]` and `extern crate rustc_xxx` declarations.
#
# Prerequisites:
#   rustup component add rustc-dev rust-src
[lib]
name = "rustc_codegen_evm"
crate-type = ["dylib"]

# Tells rust-analyzer where to find the compiler-private src so that IDE
# features work without listing them as explicit Cargo deps.
[package.metadata.rust-analyzer]
rustc_private = true

[dependencies]
evm-codegen = { path = "../evm-codegen" }
